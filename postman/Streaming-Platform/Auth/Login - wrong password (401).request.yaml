$kind: http-request
description: 'Demonstrates the error envelope: `{success:false, code:"INVALID_CREDENTIALS", message}`.'
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "host@example.com",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("401 with INVALID_CREDENTIALS", () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().code).to.eql("INVALID_CREDENTIALS");
      });
order: 4000
